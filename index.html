<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Derrotero</title>
<meta name="theme-color" content="#12303B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  /* ---------- Colores (los de la maqueta) ---------- */
  :root {
    --panel: rgba(255, 255, 255, 0.95);
    --barra: #FFFFFF;
    --hoja: #FFFFFF;
    --texto: #12303B;
    --suave: #4E6670;
    --ambar: #D98A1E;
    --gps: #1F64D6;
    --rojo: #C8402B;
    --verde: #1F7A45;
    --linea: rgba(18, 48, 59, 0.14);
    --chip: rgba(18, 48, 59, 0.06);
    --letra: "Barlow Semi Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-tema="claro"]) {
      --panel: rgba(18, 48, 59, 0.94); --barra: #12303B; --hoja: #15394A; --texto: #F3F5F2; --suave: #A9BCC2;
      --ambar: #F0A43A; --gps: #7FB0FF; --rojo: #E2553D; --verde: #4CC383;
      --linea: rgba(243, 245, 242, 0.16); --chip: rgba(243, 245, 242, 0.10); color-scheme: dark;
    }
  }
  :root[data-tema="oscuro"] {
    --panel: rgba(18, 48, 59, 0.94); --barra: #12303B; --hoja: #15394A; --texto: #F3F5F2; --suave: #A9BCC2;
    --ambar: #F0A43A; --gps: #7FB0FF; --rojo: #E2553D; --verde: #4CC383;
    --linea: rgba(243, 245, 242, 0.16); --chip: rgba(243, 245, 242, 0.10); color-scheme: dark;
  }

  /* ---------- Huecos que deja el menú según la orientación ----------
     Vertical: menú abajo. Horizontal: menú en el lateral donde queda el borde de abajo del móvil. */
  :root {
    --sup: env(safe-area-inset-top, 0px);
    --m-abajo: calc(74px + env(safe-area-inset-bottom, 0px));
    --m-der: 0px;
    --m-izq: 0px;
  }
  body.horiz { --m-abajo: 0px; --m-der: calc(90px + env(safe-area-inset-right, 0px)); }
  body.horiz.menu-izq { --m-der: 0px; --m-izq: calc(90px + env(safe-area-inset-left, 0px)); }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #12303B; font-family: var(--letra); color: var(--texto); overflow: hidden; -webkit-tap-highlight-color: transparent; }
  #mapa { position: fixed; inset: 0; }
  button { font-family: var(--letra); }
  button:focus-visible { outline: 3px solid var(--ambar); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .gris { color: var(--suave) !important; }
  .gris > svg, .gris > span { opacity: .55; }

  /* ---------- Indicadores (arriba a la izquierda) ---------- */
  #indicadores {
    position: fixed; z-index: 3;
    left: calc(var(--m-izq) + 14px); right: calc(var(--m-der) + 70px);
    top: calc(var(--sup) + 12px);
    display: flex; gap: 6px; flex-wrap: wrap; align-items: center; pointer-events: none;
  }
  .ind {
    pointer-events: auto; min-height: 32px; border: none; border-radius: 999px; padding: 0 10px;
    background: var(--panel); color: var(--texto); font-size: 15px; font-weight: 600;
    box-shadow: 0 1px 6px rgba(0,0,0,.25); display: flex; align-items: center; gap: 6px; cursor: pointer;
  }
  .ind .pto { width: 9px; height: 9px; border-radius: 50%; background: #2E9E5B; flex: none; }
  .ind.mal .pto { background: var(--ambar); }
  .ind.rojo { background: var(--rojo); color: #FFFFFF; }
  .ind.rojo .pto { background: #FFFFFF; }
  .ind svg { width: 16px; height: 16px; flex: none; }
  .ind.sol { font-variant-numeric: tabular-nums; padding: 0 9px; gap: 4px; font-size: 14px; font-weight: 700; }
  .ind.sol svg { width: 14px; height: 14px; }
  /* Pantalla nocturna: tinte rojo por encima de todo (no cambia el brillo real del móvil) */
  #tinte-noche { position: fixed; inset: 0; pointer-events: none; z-index: 100; background: #FF1A00; mix-blend-mode: multiply; opacity: 0; }
  .tabla-sol { width: 100%; border-collapse: collapse; font-size: 16px; font-variant-numeric: tabular-nums; margin: 6px 0 4px; }
  .tabla-sol th { text-align: left; color: var(--suave); font-weight: 600; padding: 4px 6px; }
  .tabla-sol td { padding: 5px 6px; border-top: 1px solid var(--linea); }
  .tabla-sol td:first-child { font-weight: 600; }
  .tabla-sol .hoy { font-weight: 700; }
  #ind-vista { color: #B0306A; }
  :root[data-tema="oscuro"] #ind-vista { color: #FF7DB4; }
  @media (prefers-color-scheme: dark) { :root:not([data-tema="claro"]) #ind-vista { color: #FF7DB4; } }

  /* ---------- Mejoras (libreta) y brújula, arriba a la derecha ---------- */
  #btn-mejoras {
    position: fixed; z-index: 7; right: calc(var(--m-der) + 14px); top: calc(var(--sup) + 14px);
    width: 38px; height: 30px; padding: 0; border: 1px solid var(--linea); border-radius: 999px;
    background: var(--panel); color: var(--texto); box-shadow: 0 1px 8px rgba(0,0,0,.28);
    display: grid; place-items: center; cursor: pointer;
  }
  #btn-mejoras svg { width: 18px; height: 18px; }
  #btn-mejoras .cnt {
    position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 4px;
    border-radius: 999px; background: var(--ambar); color: #12303B; font-size: 11px; font-weight: 700; display: grid; place-items: center;
  }
  #brujula {
    position: fixed; z-index: 3; right: calc(var(--m-der) + 10px); top: calc(var(--sup) + 56px);
    width: 46px; height: 46px; border: none; border-radius: 50%; background: var(--panel);
    box-shadow: 0 2px 10px rgba(0,0,0,.3); display: grid; place-items: center; cursor: pointer; color: var(--texto);
  }
  #brujula svg { width: 24px; height: 24px; }
  #aguja { transition: transform .2s; }

  /* ---------- Panel de datos ---------- */
  #datos {
    position: fixed; z-index: 3; left: calc(var(--m-izq) + 14px); bottom: calc(var(--m-abajo) + 66px);
    width: 186px; background: var(--panel); border-radius: 22px; padding: 8px 14px 10px;
    box-shadow: 0 2px 14px rgba(0,0,0,.3);
  }
  body.horiz #datos { bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); width: 196px; }
  #datos { max-height: calc(100% - var(--m-abajo) - 66px - var(--sup) - 56px); overflow-y: auto; overscroll-behavior: contain;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body.horiz #datos { max-height: calc(100% - var(--sup) - 24px); }
  .d-grande { display: flex; align-items: baseline; gap: 6px; }
  .d-grande .v { font-size: 64px; font-weight: 700; line-height: .95; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
  .d-grande .u { font-size: 19px; font-weight: 600; color: var(--suave); }
  .d-etq { display: block; font-size: 13px; color: var(--suave); }
  .d-celdas { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2px 8px; border-top: 1px solid var(--linea); margin-top: 6px; padding-top: 4px; }
  .d-celda { display: flex; flex-direction: column; min-width: 0; }
  .d-celda.ancha { grid-column: span 2; }
  .d-celda .n { font-size: 13px; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d-celda .v { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .u-p { font-size: 14px; font-weight: 600; color: var(--suave); margin-left: 3px; }
  .d-desp { border-top: 1px solid var(--linea); margin-top: 6px; padding-top: 2px; }
  .d-fila { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 4px 0; font-size: 15px; width: 100%; }
  .d-fila .n { color: var(--suave); }
  .d-fila .v { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .d-fila.col { flex-direction: column; align-items: flex-start; gap: 0; }
  .d-fila.col .v { text-align: left; }
  button.d-fila { border: none; background: transparent; color: var(--texto); cursor: pointer; text-align: left; font-family: var(--letra); }
  .d-cero { min-height: 32px; border: 1px solid var(--linea); background: var(--chip); color: var(--texto); border-radius: 999px; padding: 0 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .d-flecha { width: 100%; min-height: 30px; border: none; background: transparent; color: var(--suave); display: grid; place-items: center; cursor: pointer; padding: 0; }
  .d-flecha svg { width: 20px; height: 20px; transition: transform .15s; }
  #datos.abierto .d-flecha svg { transform: rotate(180deg); }
  #datos.mantener { outline: 3px solid var(--ambar); outline-offset: 2px; }

  /* Elegir datos */
  .ed-grupo { padding: 14px 18px 6px; display: flex; flex-direction: column; gap: 2px; }
  .ed-grupo b { font-size: 14px; font-weight: 700; color: var(--suave); text-transform: uppercase; letter-spacing: .04em; }
  .ed-grupo small { font-size: 13px; color: var(--suave); }
  .ed-fila { display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 2px 10px 2px 4px; border-top: 1px solid var(--linea); background: var(--hoja); }
  .ed-fila.arr { background: var(--chip); box-shadow: 0 2px 12px rgba(0,0,0,.25); position: relative; z-index: 2; }
  .ed-asa { width: 44px; height: 44px; display: grid; place-items: center; color: var(--suave); touch-action: none; cursor: grab; flex: none; }
  .ed-asa svg { width: 20px; height: 20px; }
  .ed-fila .t { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .ed-fila b { font-size: 17px; font-weight: 600; }
  .ed-fila small { font-size: 13px; color: var(--suave); }
  .ed-q { width: 40px; height: 40px; border: none; border-radius: 50%; background: var(--chip); color: var(--texto); display: grid; place-items: center; cursor: pointer; flex: none; }
  .ed-q svg { width: 18px; height: 18px; }
  .ed-anadir { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--linea); background: var(--chip); color: var(--texto); font-size: 15px; font-weight: 600; cursor: pointer; flex: none; }

  /* ---------- Botones redondos sobre el mapa ---------- */
  #botones {
    position: fixed; z-index: 3; right: calc(var(--m-der) + 14px); bottom: calc(var(--m-abajo) + 66px);
    display: flex; flex-direction: column; gap: 10px;
  }
  body.horiz #botones { bottom: auto; top: calc(var(--sup) + 110px); display: grid; grid-template-columns: repeat(2, 52px); gap: 8px; }
  .redondo {
    width: 56px; height: 56px; border: none; border-radius: 50%; background: var(--panel); color: var(--texto);
    box-shadow: 0 2px 14px rgba(0,0,0,.3); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    font-size: 13px; font-weight: 600; cursor: pointer; padding: 0;
  }
  body.horiz .redondo { width: 52px; height: 52px; font-size: 12px; }
  .redondo svg { width: 22px; height: 22px; }
  .redondo:active { transform: scale(.95); }
  #centrar { color: var(--gps); }
  #centrar.suelto { outline: 3px solid var(--gps); outline-offset: -3px; }
  #chincheta { font-size: 12px; }

  /* Cita del IGN */
  .maplibregl-ctrl-attrib { font-family: var(--letra); font-size: 12px; }
  .maplibregl-ctrl-bottom-right { z-index: 1; }
  .maplibregl-ctrl-bottom-right { right: calc(var(--m-der) + 80px); bottom: calc(var(--m-abajo) + 62px); }
  body.horiz .maplibregl-ctrl-bottom-right { right: auto; left: calc(var(--m-izq) + 222px); bottom: 2px; }

  /* ---------- Menú fijo ---------- */
  #menu {
    position: fixed; z-index: 6; left: 0; right: 0; bottom: 0; height: var(--m-abajo);
    background: var(--barra); border-top: 1px solid var(--linea); box-shadow: 0 -2px 14px rgba(0,0,0,.25);
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    padding: 6px 8px calc(env(safe-area-inset-bottom, 0px) + 6px);
  }
  body.horiz #menu {
    left: auto; top: 0; right: 0; width: var(--m-der); height: auto;
    grid-template-columns: none; grid-template-rows: repeat(4, minmax(0, 1fr));
    border-top: none; border-left: 1px solid var(--linea); box-shadow: -2px 0 14px rgba(0,0,0,.25);
    padding: calc(var(--sup) + 6px) calc(env(safe-area-inset-right, 0px) + 4px) 6px 4px;
  }
  body.horiz.menu-izq #menu {
    right: auto; left: 0; width: var(--m-izq); border-left: none; border-right: 1px solid var(--linea);
    box-shadow: 2px 0 14px rgba(0,0,0,.25); padding: calc(var(--sup) + 6px) 4px 6px calc(env(safe-area-inset-left, 0px) + 4px);
  }
  #menu button {
    border: none; background: transparent; color: var(--texto); display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; font-size: 15px; font-weight: 600; cursor: pointer; min-height: 56px; border-radius: 14px;
  }
  #menu button svg { width: 28px; height: 28px; }
  #menu button[aria-current="true"] { background: var(--chip); color: var(--gps); }

  /* ---------- Paneles del menú (media pantalla, estirables) ---------- */
  #atrapa { position: fixed; inset: 0; z-index: 4; }
  #panel {
    position: fixed; z-index: 5; left: 0; right: 0; bottom: var(--m-abajo); height: 50%;
    background: var(--hoja); color: var(--texto); border-radius: 22px 22px 0 0; box-shadow: 0 -4px 22px rgba(0,0,0,.35);
    display: flex; flex-direction: column; overflow: hidden; transition: height .22s ease, width .22s ease;
  }
  #panel.completo { height: calc(100% - var(--m-abajo) - var(--sup) - 8px); }
  body.horiz #panel { top: 0; bottom: 0; height: auto; left: auto; right: var(--m-der); width: 50%; border-radius: 22px 0 0 22px; box-shadow: -4px 0 22px rgba(0,0,0,.35); }
  body.horiz.menu-izq #panel { right: auto; left: var(--m-izq); border-radius: 0 22px 22px 0; box-shadow: 4px 0 22px rgba(0,0,0,.35); }
  body.horiz #panel.completo { width: calc(100% - var(--m-der) - var(--m-izq)); height: auto; border-radius: 0; }
  .asa { display: flex; justify-content: center; padding: 8px 0 4px; cursor: grab; touch-action: none; flex: none; }
  .asa span { width: 44px; height: 5px; border-radius: 3px; background: var(--linea); }
  body.horiz .asa { display: none; }
  .pcab { display: flex; align-items: center; gap: 8px; padding: 2px 12px 8px 18px; touch-action: none; flex: none; }
  body.horiz .pcab { padding-top: calc(var(--sup) + 12px); }
  #panel.completo .pcab, body.horiz .pcab { padding-right: 64px; }
  body.horiz.menu-izq .pcab { padding-right: 64px; }
  .pcab h2 { flex: 1; margin: 0; font-size: 22px; font-weight: 700; }
  .redondo-p { width: 44px; height: 44px; border: none; border-radius: 50%; background: var(--chip); color: var(--texto); display: grid; place-items: center; cursor: pointer; flex: none; }
  .redondo-p svg { width: 20px; height: 20px; }
  .pcuerpo { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 12px; }

  .pestanas { display: flex; gap: 6px; padding: 0 12px 8px; }
  .pestanas button { flex: 1; min-height: 44px; border: none; border-radius: 12px; background: var(--chip); color: var(--texto); font-size: 17px; font-weight: 700; cursor: pointer; }
  .pestanas button[aria-selected="true"] { background: var(--texto); color: var(--hoja); }

  .fila-lista {
    width: 100%; min-height: 64px; border: none; border-top: 1px solid var(--linea); background: transparent; color: var(--texto);
    display: flex; align-items: center; gap: 12px; padding: 8px 16px; text-align: left; cursor: pointer; font-size: 17px;
  }
  .fila-lista .t { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .fila-lista .n { font-size: 17px; font-weight: 600; }
  .fila-lista .s { font-size: 14px; color: var(--suave); }
  .fila-lista.hecha { opacity: .6; }
  .vacio { color: var(--suave); font-size: 17px; padding: 14px 18px; line-height: 1.35; }

  .grupo { padding: 14px 18px 4px; font-size: 14px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--suave); }
  .ajuste {
    width: 100%; min-height: 50px; border: none; border-top: 1px solid var(--linea); background: transparent; color: var(--texto);
    display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 18px; font-size: 17px; text-align: left; cursor: pointer;
  }
  .ajuste .v { font-size: 16px; color: var(--suave); text-align: right; }
  .interruptor { width: 50px; height: 30px; border-radius: 15px; background: var(--linea); position: relative; flex: none; transition: background .15s; }
  .interruptor::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .15s; }
  .interruptor.si { background: var(--verde); }
  .interruptor.si::after { left: 23px; }
  .nota-aj { display: block; padding: 2px 18px 6px; font-size: 14px; color: var(--suave); }

  .caja { padding: 0 14px 8px; }
  .caja label { display: block; font-size: 14px; color: var(--suave); margin-bottom: 4px; }
  .caja textarea { width: 100%; font: inherit; font-size: 17px; color: var(--texto); background: var(--chip); border: 1px solid var(--linea); border-radius: 12px; padding: 10px 12px; resize: vertical; }
  .chips { display: flex; gap: 8px; padding: 0 12px 8px; flex-wrap: wrap; }
  .chips button { min-height: 40px; padding: 0 12px; border: 1px solid var(--linea); border-radius: 999px; background: var(--chip); color: var(--texto); font-size: 15px; font-weight: 600; cursor: pointer; }
  .chips button.sel { background: var(--texto); color: var(--hoja); }
  .chips .ok { background: var(--texto); color: var(--hoja); }

  /* ---------- Hojas de confirmación y fichas (encima de todo) ---------- */
  #velo { position: fixed; inset: 0; z-index: 19; background: rgba(0,0,0,.45); }
  #hoja {
    position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; max-height: 92vh; overflow-y: auto;
    background: var(--hoja); color: var(--texto); border-radius: 22px 22px 0 0;
    padding: 18px 18px calc(env(safe-area-inset-bottom, 0px) + 18px);
    box-shadow: 0 -4px 20px rgba(0,0,0,.35); max-width: 640px; margin: 0 auto;
  }
  #hoja h2 { font-size: 26px; margin: 0 0 6px; font-weight: 700; }
  #hoja h3 { font-size: 20px; margin: 18px 0 6px; font-weight: 600; }
  #hoja p { font-size: 17px; line-height: 1.4; margin: 6px 0; }
  .pista { color: var(--suave); font-size: 16px !important; }
  .cab { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .cab h2 { flex: 1; margin: 0 !important; }
  .cerrar { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--chip); color: var(--texto); font-size: 26px; line-height: 1; cursor: pointer; }
  .acciones { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .acciones button {
    flex: 1; min-height: 52px; border-radius: 14px; border: 1px solid var(--linea);
    background: var(--chip); color: var(--texto); font-size: 18px; font-weight: 600; cursor: pointer; padding: 0 14px;
  }
  .acciones .ok { background: var(--texto); color: var(--hoja); border-color: transparent; }
  .acciones .peligro { color: var(--rojo); }
  .acciones .rojo { background: var(--rojo); color: #FFFFFF; border-color: transparent; }
  label.f { display: block; font-size: 16px; color: var(--suave); margin: 12px 0 4px; }
  input[type=text], #hoja textarea {
    width: 100%; font: inherit; font-size: 18px; color: var(--texto); background: var(--chip);
    border: 1px solid var(--linea); border-radius: 12px; padding: 10px 12px;
  }
  .err { color: var(--rojo); font-size: 16px; margin-top: 6px; padding: 0 14px; }
  #hoja .err { padding: 0; }
  .seg { display: flex; border: 1px solid var(--linea); border-radius: 12px; overflow: hidden; margin-top: 8px; }
  .seg button { flex: 1; min-height: 46px; border: none; background: transparent; color: var(--texto); font-size: 17px; font-weight: 600; cursor: pointer; }
  .seg button.sel { background: var(--texto); color: var(--hoja); }
  .cifras { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 16px; margin-top: 10px; }
  .cifra .v { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cifra .n { font-size: 15px; color: var(--suave); }
  .grafica { width: 100%; height: auto; display: block; margin-top: 4px; }
  .grafica text { font-family: var(--letra); font-size: 11px; fill: var(--suave); }

  #aviso-toast {
    position: fixed; z-index: 30; left: 50%; transform: translateX(-50%);
    bottom: calc(var(--m-abajo) + 140px);
    background: var(--texto); color: var(--hoja); padding: 10px 16px; border-radius: 12px;

<script>
(function () {
  "use strict";
  var VERSION_APP = "0.2.1";
  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };

  // ---------- Utilidades ----------
  function esc(t) { return String(t).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function leer(clave, porDefecto) {
    try { var v = localStorage.getItem("derrotero." + clave); return v ? JSON.parse(v) : porDefecto; }
    catch (e) { return porDefecto; }
  }
  function guardar(clave, valor) { try { localStorage.setItem("derrotero." + clave, JSON.stringify(valor)); } catch (e) {} }
  function km(m) { return (m / 1000).toLocaleString("es-ES", { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }
  function duracion(seg) {
    seg = Math.max(0, Math.round(seg));
    var h = Math.floor(seg / 3600), m = Math.floor((seg % 3600) / 60), s = seg % 60;
    return h ? h + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0") : m + ":" + String(s).padStart(2, "0");
  }
  function fechaHora(ms) {
    var d = new Date(ms);
    return d.toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit", year: "numeric" }) + " " + d.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
  }
  function distancia(a, b) {
    var R = 6371000, r = Math.PI / 180;
    var dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
    var x = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  var temporizadorToast = null;
  function toast(t) {
    var el = $("#aviso-toast"); el.textContent = t; el.hidden = false;
    clearTimeout(temporizadorToast); temporizadorToast = setTimeout(function () { el.hidden = true; }, 2500);
  }
  // Botones de funciones que aún no existen: en gris, dicen en qué fase llegan
  function avisoFase(f) { toast(f === "0.2.1" ? "En construcción: llega en esta versión" : "Llega en la Fase " + f); }
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-fase]");
    if (b) { e.stopPropagation(); e.preventDefault(); avisoFase(b.dataset.fase); }
  }, true);

  // ---------- Tema ----------
  var ajustes = leer("ajustes", { tema: "movil", pantalla: true });
  function aplicarTema() {
    if (nocheActiva) document.documentElement.setAttribute("data-tema", "oscuro");   // pantalla nocturna (según el sol)
    else if (ajustes.tema === "claro" || ajustes.tema === "oscuro") document.documentElement.setAttribute("data-tema", ajustes.tema);
    else document.documentElement.removeAttribute("data-tema");
  }
  aplicarTema();
  function guardarAjustes() { guardar("ajustes", ajustes); }

  // ---------- Orientación: el menú sigue al borde de abajo del móvil ----------
  // Vertical: abajo. Girado a la izquierda (ángulo 90): el borde de abajo queda a la derecha.
  // Girado a la derecha (ángulo 270): queda a la izquierda. (Suposición a comprobar en el móvil.)
  function orientar() {
    var horiz = window.innerWidth > window.innerHeight;
    var ang = (screen.orientation && typeof screen.orientation.angle === "number") ? screen.orientation.angle : (window.orientation || 0);
    document.body.classList.toggle("horiz", horiz);

  }
  window.addEventListener("resize", orientar);
  if (screen.orientation) screen.orientation.addEventListener("change", orientar);
  orientar();

        var txt = "Analiza estas mejoras pendientes de mi app Derrotero (versión " + VERSION_APP + "). Para cada una, por su número, dime qué crees que pasa, qué propones y en qué versión entraría.\n\n" +
          p.map(function (n) { return "Nº " + n.n + " | " + fechaHora(n.fecha) + " | Pantalla: " + n.pantalla + " | Capa: " + n.capa + " | Grabando: " + (n.grabando ? "sí" : "no") + " | Posición: " + textoPos(n) + " | v" + n.version + "\n" + n.texto; }).join("\n\n");
        navigator.clipboard.writeText(txt).then(function () { toast(p.length + (p.length === 1 ? " mejora copiada" : " mejoras copiadas")); })
          .catch(function () { $("#errn").textContent = "No se ha podido copiar. Inténtalo otra vez."; });
      };
      $$("[data-n]").forEach(function (b) { b.onclick = function () { hojaNota(b.dataset.n); }; });
    };
    if (abrir || panelAbierto !== "mejoras") abrirPanel("mejoras", "Mejoras", html, alAbrir); else repintarPanel(html, alAbrir);
  }
  function hojaNota(id) {
    var n = notas.filter(function (x) { return x.id === id; })[0]; if (!n) return;
    var html = '<h2>Mejora nº ' + n.n + '</h2><p class="pista">' + esc(metaNota(n)) + '</p>' +
      '<label class="f" for="tx">Texto</label><textarea id="tx" rows="4">' + esc(n.texto) + '</textarea>' +
      '<label class="f">Estado</label><div class="seg" id="es">' + Object.keys(ESTADOS).map(function (v) { return '<button data-v="' + v + '" class="' + (n.estado === v ? "sel" : "") + '">' + ESTADOS[v] + '</button>'; }).join("") + '</div>' +
      '<div class="err" id="err"></div>' +
      '<div class="acciones"><button id="no">Volver</button><button class="ok" id="si">Guardar</button></div>' +
      '<div class="acciones"><button class="peligro" id="del">Borrar mejora</button></div>';
    var estado = n.estado;
    abrirHoja(html, "Mejoras", function () {
      $$("#es button").forEach(function (b) { b.onclick = function () { estado = b.dataset.v; $$("#es button").forEach(function (x) { x.classList.toggle("sel", x === b); }); }; });
      $("#no").onclick = cerrarHoja;
      $("#si").onclick = function () {
        var v = $("#tx").value.trim();
        if (!v) { $("#err").textContent = "La mejora no puede quedar vacía. Si sobra, bórrala."; return; }
        if (v !== n.texto) { n.texto = v; n.editada = true; }
        n.estado = estado; n.cambio = Date.now();
        guardarNotas(); toast("Mejora guardada"); cerrarHoja(); pintarNotas();
      };
      $("#del").onclick = function () {
        abrirHoja('<h2>¿Borrar la mejora nº ' + n.n + '?</h2><p>' + esc(n.texto) + '</p><p>No se puede deshacer. Si ya está arreglada, mejor márcala como resuelta.</p><div class="acciones"><button id="no2">Cancelar</button><button class="rojo" id="si2">Borrar</button></div>', "Mejoras", function () {
          $("#no2").onclick = function () { hojaNota(id); };
          $("#si2").onclick = function () { notas = notas.filter(function (x) { return x.id !== id; }); guardarNotas(); toast("Mejora borrada"); cerrarHoja(); pintarNotas(); };
        });
      };
    });
  }
  $("#btn-mejoras").addEventListener("click", abrirMejoras);
  pintarContador();
  pintarAbajo();
  pintarPanelDatos();

  // ---------- Al abrir: grabación sin terminar ----------
  abrirBD().then(function () { return todosRec(); }).then(function (lista) {
    var abierta = lista.filter(function (r) { return r.estado === "grabando" || r.estado === "pausa"; }).sort(function (a, b) { return b.inicio - a.inicio; })[0];
    if (!abierta) return;
    puntosDe(abierta.id).then(function (pts) {
      pts.sort(function (a, b) { return a.t - b.t; });
      var c = calcular(pts);
      var pausada = abierta.estado === "pausa";
      abrirHoja('<h2>Tienes una salida sin terminar</h2><p>Empezó el ' + fechaHora(abierta.inicio) + ' y lleva ' + km(c.dist) + ' km' + (pausada ? '. Está en pausa' : '') + '.</p>' +
        '<div class="acciones"><button id="fin">Terminarla</button><button class="ok" id="cont">' + (pausada ? "Seguir (en pausa)" : "Seguir grabando") + '</button></div>', "Salida sin terminar", function () {
        $("#cont").onclick = function () {
          if (!pausada) { abierta.seg = (abierta.seg || 0) + 1; guardarRec(abierta); }
          empezarGrabacion(abierta, pts); cerrarHoja(); toast(pausada ? "Salida en pausa" : "Grabando");
        };
        $("#fin").onclick = function () { empezarGrabacion(abierta, pts); cerrarHoja(); setTimeout(terminarGrabacion, 60); };
      });
    });
  }).catch(function () { toast("Este móvil no deja guardar salidas"); });

  // ---------- Conexión ----------
  function verRed() { $("#ind-red").hidden = navigator.onLine; }
  window.addEventListener("online", verRed); window.addEventListener("offline", verRed); verRed();
  $("#ind-red").addEventListener("click", function () { toast("Sin conexión: solo se ve el mapa ya cargado. «Volver a la cobertura» llega más adelante."); });

  // ---------- Pantalla siempre encendida ----------
  var bloqueo = null;
  function quierePantalla() { return !!ajustes.pantalla; }   // navegando una ruta (Fase 3) será siempre
  function gestionarPantalla() {
    if (quierePantalla()) {
      if (bloqueo) return;
      if (!("wakeLock" in navigator)) { $("#ind-pantalla").hidden = false; return; }
      navigator.wakeLock.request("screen").then(function (b) {
        bloqueo = b; $("#ind-pantalla").hidden = true;
        b.addEventListener("release", function () { bloqueo = null; });
      }).catch(function () { $("#ind-pantalla").hidden = false; });
    } else {
      $("#ind-pantalla").hidden = true;
      if (bloqueo) { bloqueo.release().catch(function () {}); bloqueo = null; }
    }
  }
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") gestionarPantalla(); });
  gestionarPantalla();

  // ---------- Funcionar como app instalada ----------
  if ("serviceWorker" in navigator) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
})();
</script>
</body>
</html>
